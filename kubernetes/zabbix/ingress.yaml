---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zabbix-ingress
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: freeipa-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zabbix.lab.internal
      secretName: zabbix-tls
  rules:
    - host: zabbix.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zabbix-zabbix-web
                port:
                  number: 8080
