---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: awx-ingress
  namespace: devops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: freeipa-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - awx.lab.internal
      secretName: awx-tls
  rules:
    - host: awx.lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: awx-service
                port:
                  number: 80
