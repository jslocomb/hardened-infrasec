---
# AWX GitLab SCM Credential
# Apply via AWX API or configure through the UI after deployment.
#
# Credential Type: Source Control
# Name: gitlab-scm-credential
# Username: git
# SSH Private Key: (contents of the deploy key created in GitLab)
#
# In GitLab:
#   Settings > Repository > Deploy Keys
#   Create a key with read-only access to the playbook repo.
#
# In AWX:
#   Credentials > Add > Source Control
#   SCM Type: Git
#   SSH Private Key: paste the private key here
#
# Project configuration in AWX:
#   Name: Homelab Playbooks
#   SCM Type: Git
#   SCM URL: git@gitlab.lab.internal:infra/ansible-playbooks.git
#   SCM Credential: gitlab-scm-credential
#   SCM Branch: main
#   Update on Launch: true
#   Webhook: configure GitLab webhook to trigger AWX sync on push
