---
# GitLab LDAP configuration reference
# These values are injected via Helm values.yaml → global.ldap
# This file documents the FreeIPA LDAP mapping for GitLab.
#
# FreeIPA Groups to create:
#   cn=gitlab-users,cn=groups,cn=accounts,dc=lab,dc=internal
#   cn=gitlab-admins,cn=groups,cn=accounts,dc=lab,dc=internal
#
# Service account to create in FreeIPA:
#   uid=gitlab-bind,cn=users,cn=accounts,dc=lab,dc=internal
#   (Read-only, member of no groups, only needs LDAP read access)
#
# HBAC rule: Allow gitlab-bind to authenticate from cluster nodes only.
