---
apiVersion: enterprise.splunk.com/v4
kind: Standalone
metadata:
  name: standalone
  namespace: logging
  finalizers:
    - enterprise.splunk.com/delete-pvc
spec:
  image: splunk/splunk:9.2.0

  # Storage
  storageClassName: longhorn
  etcVolumeStorageConfig:
    storageClassName: longhorn
    storageCapacity: 10Gi
  varVolumeStorageConfig:
    storageClassName: longhorn
    storageCapacity: 50Gi

  # Credentials
  defaults: |-
    splunk:
      password: CHANGEME  # Overridden by secret

  serviceAccount: splunk-operator

  # Resource limits
  resources:
    splunkd:
      requests:
        cpu: "0.5"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

  # Enable HTTP Event Collector (HEC) for log ingestion
  extraEnv:
    - name: SPLUNK_HEC_TOKEN
      valueFrom:
        secretKeyRef:
          name: splunk-standalone-secret
          key: hec_token
