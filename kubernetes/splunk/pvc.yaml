---
# Note: Splunk Operator manages PVCs automatically via the CR spec.
# This file is for reference / manual override if needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splunk-standalone-data
  namespace: logging
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
