---
# Splunk Operator for Kubernetes
# Source: https://github.com/splunk/splunk-operator
# Install the operator into the logging namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
# Apply the official operator manifest
# kubectl apply -f https://github.com/splunk/splunk-operator/releases/download/2.4.0/splunk-operator-namespace.yaml
#
# Or for cluster-wide install:
# kubectl apply -f https://github.com/splunk/splunk-operator/releases/download/2.4.0/splunk-operator-cluster.yaml
#
# This file is a placeholder — download the actual manifest from:
# https://github.com/splunk/splunk-operator/releases
#
# Pin to a specific version:
# SPLUNK_OPERATOR_VERSION=2.4.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-operator-controller-manager
  namespace: logging
  labels:
    app: splunk-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splunk-operator
  template:
    metadata:
      labels:
        app: splunk-operator
    spec:
      containers:
        - name: manager
          image: docker.io/splunk/splunk-operator:2.4.0
          imagePullPolicy: IfNotPresent
