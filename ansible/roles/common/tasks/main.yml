---
# roles/common/tasks/main.yml
# Applied to all nodes — Debian 12 (Bookworm)
# Prepares base OS for Kubernetes: swap disabled, kernel modules,
# sysctl params, package cache updated, ufw enabled

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  apt:
    name: "*"
    state: latest
    update_cache: false
  register: apt_upgrade
  notify: reboot if kernel updated

- name: Disable swap immediately
  command: swapoff -a
  changed_when: false

- name: Remove swap from /etc/fstab permanently
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules | default(['overlay', 'br_netfilter']) }}"

- name: Persist kernel modules across reboots
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Apply K8s sysctl parameters
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop: "{{ k8s_sysctl_params | default({}) | dict2items }}"

- name: Enable ufw firewall
  block:
    - name: Install ufw
      apt:
        name: ufw
        state: present
        update_cache: true

    - name: Enable ufw firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Allow SSH through ufw
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow all outgoing traffic
      ufw:
        state: enabled
        policy: allow
        direction: outgoing

- name: Disable unnecessary services
  service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - bluetooth
    - avahi-daemon
  failed_when: false
  ignore_errors: true
