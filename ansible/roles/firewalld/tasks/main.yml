---
# roles/firewalld/tasks/main.yml
# Configure firewalld rules appropriate to the node's role.

- name: Ensure firewalld is running
  service:
    name: firewalld
    state: started
    enabled: true

- name: Set default zone to drop
  command: firewall-cmd --set-default-zone=drop
  changed_when: false

- name: Open SSH port in trusted zone for management subnet
  firewalld:
    zone: trusted
    service: ssh
    permanent: true
    state: enabled

- name: Add management subnet to trusted zone
  firewalld:
    zone: trusted
    source: "{{ management_subnet | default('192.168.10.0/24') }}"
    permanent: true
    state: enabled

- name: Open RKE2 server ports on control plane
  firewalld:
    zone: trusted
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop: "{{ rke2_server_firewall_ports }}"
  when: inventory_hostname in groups['control_plane']

- name: Open RKE2 agent ports on workers
  firewalld:
    zone: trusted
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop: "{{ rke2_agent_firewall_ports }}"
  when: inventory_hostname in groups['workers']

- name: Open Longhorn ports
  firewalld:
    zone: trusted
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - "9500/tcp"
    - "9501/tcp"
    - "9502/tcp"

- name: Reload firewalld
  command: firewall-cmd --reload
  changed_when: false
