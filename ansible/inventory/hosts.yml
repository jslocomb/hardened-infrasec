---
all:
  vars:
    ansible_user: rocky
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_common_args: '-o ProxyJump=bastion -o StrictHostKeyChecking=no'

  children:

    freeipa:
      hosts:
        ipa01:
          ansible_host: 10.0.10.121

    k8s_cluster:
      children:
        control_plane:
          hosts:
            k8s-cp01:
              ansible_host: 10.0.10.154
              rke2_type: server

        workers:
          hosts:
            k8s-w01:
              ansible_host: 10.0.10.187
              rke2_type: agent
              node_labels:
                - "node-role=devops"

            k8s-w02:
              ansible_host: 10.0.10.201
              rke2_type: agent
              node_labels:
                - "node-role=monitoring"

    k8s_nodes:
      children:
        control_plane:
        workers:
