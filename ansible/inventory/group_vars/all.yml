---
# ─── DNS / Domain ─────────────────────────────────────────────────────────────
lab_domain: lab.internal
freeipa_hostname: ipa01.lab.internal
freeipa_ip: 10.0.10.121

# ─── K8s Cluster ──────────────────────────────────────────────────────────────
k8s_cp_ip: 10.0.10.154
rke2_version: v1.28.6+rke2r1
rke2_cni: canal
rke2_profile: cis-1.23

# ─── MetalLB / Ingress ────────────────────────────────────────────────────────
metallb_ip_range: 10.0.10.200-10.0.10.220
ingress_class: nginx

# ─── NTP ──────────────────────────────────────────────────────────────────────
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org

# ─── K8s Kernel Requirements ──────────────────────────────────────────────────
k8s_kernel_modules:
  - overlay
  - br_netfilter

k8s_sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.forwarding: 1
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512

# ─── Base packages (Rocky Linux 9 / dnf) ─────────────────────────────────────
base_packages:
  - vim
  - curl
  - wget
  - git
  - bash-completion
  - bind-utils
  - net-tools
  - tcpdump
  - lsof
  - audit
  - aide
  - chrony
  - firewalld
  - python3
  - ca-certificates
  - epel-release
