---
# install_freeipa.yml
# Installs FreeIPA server natively on Rocky Linux 9 on ipa01.
# Native dnf install -- no containers, no workarounds.
#
# CMMC Controls covered:
#   AC-3.1.1, AC-3.1.2 -- Access control via HBAC rules
#   IA-3.5.1, IA-3.5.2 -- Identification and authentication
#   IA-3.5.4            -- Multi-factor authentication (TOTP)
#   IA-3.5.7            -- Password complexity enforcement
#   SC-3.13.8           -- Kerberos encryption for data in transit

- name: Install FreeIPA server on ipa01
  hosts: freeipa
  become: true
  gather_facts: true

  vars:
    ipa_domain: "{{ lab_domain }}"
    ipa_realm: "{{ lab_domain | upper }}"
    ipa_hostname: "ipa01.{{ lab_domain }}"
    ipa_ip: "{{ ansible_default_ipv4.address }}"
    ipa_admin_password: "FreeIPA_Admin2026!"
    ipa_ds_password: "FreeIPA_DS2026!"

  pre_tasks:
    - name: Set FQDN hostname
      hostname:
        name: "ipa01.{{ lab_domain }}"

    - name: Ensure FQDN in /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ ansible_default_ipv4.address }} ipa01.{{ lab_domain }} ipa01"
        state: present

    - name: Ensure reverse lookup works
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 localhost localhost.localdomain"
        state: present

  tasks:
    # ── Memory check ─────────────────────────────────────────────────────────
    - name: Check available memory
      command: free -m
      register: memory_check
      changed_when: false

    - name: Display memory
      debug:
        msg: "{{ memory_check.stdout_lines }}"

    # ── Firewall rules for FreeIPA ────────────────────────────────────────────
    - name: Open FreeIPA ports in firewalld
      firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - freeipa-ldap
        - freeipa-ldaps
        - freeipa-replication
        - dns
        - ntp
        - kerberos
        - kpasswd
        - http
        - https

    # ── Install FreeIPA packages ──────────────────────────────────────────────
    - name: Install FreeIPA server packages
      dnf:
        name:
          - freeipa-server
          - freeipa-server-dns
          - freeipa-server-trust-ad
        state: present
        update_cache: true

    # ── Run FreeIPA installer ─────────────────────────────────────────────────
    - name: Check if FreeIPA is already installed
      stat:
        path: /etc/ipa/default.conf
      register: ipa_installed

    - name: Install FreeIPA server (takes 5-10 minutes)
      command: >
        ipa-server-install
        --unattended
        --realm={{ ipa_realm }}
        --domain={{ ipa_domain }}
        --hostname=ipa01.{{ ipa_domain }}
        --ip-address={{ ipa_ip }}
        --admin-password={{ ipa_admin_password }}
        --ds-password={{ ipa_ds_password }}
        --setup-dns
        --auto-forwarders
        --auto-reverse
        --no-dnssec-validation
        --no-ntp
      when: not ipa_installed.stat.exists
      register: ipa_install
      async: 900
      poll: 30

    - name: Display install result
      debug:
        msg: "{{ ipa_install.stdout_lines | default(['FreeIPA already installed']) }}"
      when: ipa_install is defined

    # ── Post-install configuration ────────────────────────────────────────────
    - name: Enable and start FreeIPA services
      service:
        name: ipa
        state: started
        enabled: true

    - name: Check FreeIPA services status
      command: ipactl status
      register: ipa_status
      changed_when: false

    - name: Display FreeIPA status
      debug:
        msg: "{{ ipa_status.stdout_lines }}"

    # ── Create CMMC-required groups ───────────────────────────────────────────
    - name: Get Kerberos ticket for admin operations
      command: >
        kinit admin
      args:
        stdin: "{{ ipa_admin_password }}"
      changed_when: false
      no_log: true

    - name: Create k8s-admins group
      command: ipa group-add k8s-admins --desc="Kubernetes administrators"
      register: group_result
      failed_when:
        - group_result.rc != 0
        - "'already exists' not in group_result.stderr"
      changed_when: group_result.rc == 0

    - name: Create k8s-users group
      command: ipa group-add k8s-users --desc="Kubernetes users"
      register: group_result
      failed_when:
        - group_result.rc != 0
        - "'already exists' not in group_result.stderr"
      changed_when: group_result.rc == 0

    - name: Create cluster-admins group
      command: ipa group-add cluster-admins --desc="Cluster administrators - CMMC privileged access"
      register: group_result
      failed_when:
        - group_result.rc != 0
        - "'already exists' not in group_result.stderr"
      changed_when: group_result.rc == 0

  post_tasks:
    - name: Display FreeIPA summary
      debug:
        msg:
          - "FreeIPA installation complete"
          - "Web UI: https://ipa01.{{ lab_domain }}"
          - "Admin user: admin"
          - "Admin password: {{ ipa_admin_password }}"
          - "Realm: {{ ipa_realm }}"
          - "Domain: {{ ipa_domain }}"
          - "DNS server: {{ ipa_ip }}"
          - ""
          - "Next step: Update k8s nodes to use FreeIPA DNS"
          - "  ansible-playbook playbooks/update_dns.yml"
