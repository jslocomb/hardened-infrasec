---
# deploy_longhorn.yml
# Deploys Longhorn distributed block storage for persistent volumes.

- name: Deploy Longhorn Storage
  hosts: control_plane
  become: false
  gather_facts: false
  environment:
    KUBECONFIG: /etc/rancher/rke2/server/creds/admin.kubeconfig

  pre_tasks:
    - name: Ensure iscsi and nfs packages on all workers
      dnf:
        name:
          - iscsi-initiator-utils
          - nfs-utils
        state: present
      delegate_to: "{{ item }}"
      become: true
      loop: "{{ groups['workers'] }}"

    - name: Enable iscsid on all workers
      service:
        name: iscsid
        state: started
        enabled: true
      delegate_to: "{{ item }}"
      become: true
      loop: "{{ groups['workers'] }}"

  tasks:
    - name: Add Longhorn Helm repo
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io

    - name: Install Longhorn via Helm
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: longhorn-system
        create_namespace: true
        values_files:
          - "{{ playbook_dir }}/../../kubernetes/longhorn/values.yaml"
        wait: true
        timeout: 10m0s

    - name: Patch Longhorn to be default StorageClass
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
