---
# provision_vms.yml
# Initial VM setup applied to all nodes immediately after Terraform provisioning.
# Debian 12 (Bookworm) — apt instead of dnf, ufw instead of firewalld, no SELinux

- name: Initial VM provisioning
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather facts
      setup:

  roles:
    - common

  tasks:
    - name: Set hostname from inventory
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Update /etc/hosts with all cluster nodes
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] }} {{ item }}.{{ lab_domain }} {{ item }}"
        state: present
      loop: "{{ groups['all'] }}"

    - name: Install base packages
      apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set timezone to UTC
      timezone:
        name: UTC

    - name: Configure chrony NTP
      copy:
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          {% for server in ntp_servers %}
          pool {{ server }} iburst
          {% endfor %}
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
      notify: restart chrony

    - name: Enable and start chrony
      service:
        name: chrony
        state: started
        enabled: true

    - name: Configure resolv.conf with temporary DNS until FreeIPA is up
      copy:
        dest: /etc/resolv.conf
        content: |
          search {{ lab_domain }}
          nameserver 8.8.8.8
          nameserver 8.8.4.4
        mode: '0644'

  handlers:
    - name: restart chrony
      service:
        name: chrony
        state: restarted
