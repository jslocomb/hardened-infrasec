# k8s/falco/custom_rules.yaml
# Lab-specific Falco rule overrides and custom detections
# Uses Falco override syntax to append conditions to default rules.

# ── Suppress known-good noise via rule overrides ──────────────────────────────

- rule: Run shell untrusted
  condition: and not (not container and proc.pname = splunkd and proc.name in (sh, bash, dash))
  override:
    condition: append

- rule: Contact K8S API Server From Container
  condition: >
    and not (k8s.ns.name = "awx" and container.name = "awx-task" and proc.name = "awx-manage")
    and not (k8s.ns.name = "monitoring" and container.name in (grafana-sc-dashboard, grafana-sc-datasources))
  override:
    condition: append

# ── Custom Detections ─────────────────────────────────────────────────────────

- rule: Unexpected outbound connection on suspicious port
  desc: Detects outbound TCP connections to common C2 ports from any container.
  condition: >
    outbound
    and container
    and not k8s.ns.name in (kube-system, falco, cert-manager, monitoring)
    and fd.rport in (4444, 1337, 8888, 9999, 31337)
  output: "Suspicious outbound connection pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name image=%container.image.repository"
  priority: WARNING
  tags: [network, custom, homelab, cmmc_si_3_14_7]

- rule: New executable written to container at runtime
  desc: Detects script or binary files written to a container filesystem at runtime.
  condition: >
    open_write
    and container
    and not k8s.ns.name in (kube-system, falco)
    and (fd.name endswith ".sh" or fd.name endswith ".py" or fd.name endswith ".elf" or fd.name endswith ".so")
    and not proc.name in (ansible, pip3, dnf, rpm)
    and not fd.name startswith "/tmp/ansible"
  output: "Executable written to container at runtime pod=%k8s.pod.name ns=%k8s.ns.name file=%fd.name proc=%proc.name image=%container.image.repository"
  priority: WARNING
  tags: [execution, persistence, custom, homelab, cmmc_si_3_14_2]

- rule: Sensitive file access in ipa namespace
  desc: Access to keytab or credential files within the ipa namespace by unexpected processes.
  condition: >
    open_read
    and k8s.ns.name = "ipa"
    and (fd.name contains ".keytab" or fd.name contains "krb5.conf" or fd.name contains "ca.crt" or fd.name contains "private")
    and not proc.name in (httpd, ipa, named, krb5kdc, kadmind, sssd)
  output: "Sensitive FreeIPA file accessed pod=%k8s.pod.name proc=%proc.name file=%fd.name user=%user.name image=%container.image.repository"
  priority: ERROR
  tags: [credential_access, custom, homelab, cmmc_ia_3_5_1]
