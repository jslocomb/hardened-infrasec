# gitlab-values.yaml
# Minimal GitLab CE deployment for homelab-k8s CMMC portfolio
# Optimized for t3.medium (4GB RAM) worker nodes
# Deploys to k8s-w01 (node-role=devops)

global:
  edition: ce
  hosts:
    domain: lab.internal
    https: false
    gitlab:
      name: gitlab.lab.internal
  ingress:
    enabled: false
  # FreeIPA LDAP authentication
  appConfig:
    ldap:
      enabled: true
      servers:
        main:
          label: "FreeIPA"
          host: ipa01.lab.internal
          port: 389
          uid: uid
          bind_dn: "uid=admin,cn=users,cn=accounts,dc=lab,dc=internal"
          password: "FreeIPA_Admin2026!"
          encryption: plain
          verify_certificates: false
          base: "cn=accounts,dc=lab,dc=internal"
          user_filter: ""
          attributes:
            username: uid
            email: mail
            name: displayName

# Disable components we don't need
certmanager:
  install: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

grafana:
  enabled: false

# GitLab components - minimal resource requests
gitlab:
  webservice:
    replicaCount: 1
    resources:
      requests:
        cpu: 300m
        memory: 1.5G
      limits:
        cpu: 1
        memory: 2G
    nodeSelector:
      node-role: devops

  sidekiq:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512M
      limits:
        cpu: 500m
        memory: 1G
    nodeSelector:
      node-role: devops

  gitaly:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 200M
      limits:
        cpu: 500m
        memory: 512M
    nodeSelector:
      node-role: devops

  toolbox:
    enabled: true
    nodeSelector:
      node-role: devops

  gitlab-shell:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 64M
      limits:
        cpu: 200m
        memory: 128M
    nodeSelector:
      node-role: devops

  kas:
    enabled: false

  migrations:
    enabled: true
    nodeSelector:
      node-role: devops

# Registry disabled - saves ~500MB RAM
registry:
  enabled: false

# Minio for object storage
minio:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128M
    limits:
      cpu: 500m
      memory: 256M
  nodeSelector:
    node-role: devops

# PostgreSQL
postgresql:
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256M
      limits:
        cpu: 500m
        memory: 512M
    nodeSelector:
      node-role: devops

# Redis
redis:
  master:
    resources:
      requests:
        cpu: 100m
        memory: 64M
      limits:
        cpu: 200m
        memory: 128M
    nodeSelector:
      node-role: devops
