---
# .gitlab-ci.yml
# GitLab CI/CD Pipeline for Homelab K8s Infrastructure

stages:
  - validate
  - plan
  - deploy
  - verify

variables:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"

# ─── Terraform ────────────────────────────────────────────────────────────────

tf:validate:
  stage: validate
  image: hashicorp/terraform:1.6
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - terraform/**/*

tf:plan:
  stage: plan
  image: hashicorp/terraform:1.6
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**/*

# ─── Ansible Lint ─────────────────────────────────────────────────────────────

ansible:lint:
  stage: validate
  image: cytopia/ansible-lint:latest
  script:
    - ansible-lint ansible/playbooks/
  rules:
    - changes:
        - ansible/**/*

# ─── Kubernetes Manifest Validation ───────────────────────────────────────────

k8s:validate:
  stage: validate
  image: bitnami/kubectl:latest
  script:
    - find kubernetes/ -name "*.yaml" -exec kubectl apply --dry-run=client -f {} \;
  rules:
    - changes:
        - kubernetes/**/*

# ─── Deploy Stages ────────────────────────────────────────────────────────────

deploy:monitoring:
  stage: deploy
  image: cytopia/ansible:latest
  script:
    - ansible-playbook ansible/playbooks/deploy_monitoring.yml
  environment:
    name: homelab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/prometheus/**/*
        - kubernetes/grafana/**/*
      when: manual

deploy:awx:
  stage: deploy
  image: cytopia/ansible:latest
  script:
    - ansible-playbook ansible/playbooks/deploy_awx.yml
  environment:
    name: homelab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ─── Verify ───────────────────────────────────────────────────────────────────

verify:cluster:
  stage: verify
  image: bitnami/kubectl:latest
  script:
    - bash scripts/verify-cluster-health.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
