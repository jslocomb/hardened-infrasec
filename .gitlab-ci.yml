---
# .gitlab-ci.yml
# ──────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD Pipeline — Homelab K8s Infrastructure + Security Automation
#
# Stages:
#   validate  — Terraform validate, Ansible lint, K8s manifest dry-run,
#               Python flake8 + bandit
#   plan      — Terraform plan
#   test      — pytest unit tests for Python security scripts
#   deploy    — Ansible deploy (manual gate)
#   verify    — Cluster health check + test report summary
# ──────────────────────────────────────────────────────────────────────────────

stages:
  - validate
  - plan
  - test
  - deploy
  - verify

# ─────────────────────────────────────────────────────────────────────────────
# Shared configuration
# ─────────────────────────────────────────────────────────────────────────────

variables:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  SCRIPTS_DIR: "scripts"
  TESTS_DIR: "tests"
  PYTHONPATH: "${SCRIPTS_DIR}"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"

.python-base:
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip --quiet
    - pip install flake8 bandit pytest pytest-cov --quiet
  cache:
    key: "python-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip/

# ─────────────────────────────────────────────────────────────────────────────
# Stage: validate
# ─────────────────────────────────────────────────────────────────────────────

# ── Terraform ─────────────────────────────────────────────────────────────────

tf:validate:
  stage: validate
  image: hashicorp/terraform:1.6
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - terraform/**/*

# ── Ansible ───────────────────────────────────────────────────────────────────

ansible:lint:
  stage: validate
  image: cytopia/ansible-lint:latest
  script:
    - ansible-lint ansible/playbooks/
  rules:
    - changes:
        - ansible/**/*

# ── Kubernetes manifests ──────────────────────────────────────────────────────

k8s:validate:
  stage: validate
  image: bitnami/kubectl:latest
  script:
    - find kubernetes/ -name "*.yaml" -exec kubectl apply --dry-run=client -f {} \;
  rules:
    - changes:
        - kubernetes/**/*

# ── Python: flake8 ────────────────────────────────────────────────────────────

lint:flake8:
  extends: .python-base
  stage: validate
  script:
    - echo "=== flake8 style and syntax check ==="
    - flake8
        --max-line-length=120
        --ignore=W503,E402
        --exclude=.git,__pycache__,.cache
        --statistics
        --count
        ${SCRIPTS_DIR}/aide_to_splunk.py
        ${SCRIPTS_DIR}/freeipa_account_auditor.py
        ${SCRIPTS_DIR}/k8s_secret_auditor.py
    - echo "flake8 PASSED"
  allow_failure: false
  rules:
    - changes:
        - scripts/**/*
        - tests/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Python: bandit (advisory) ─────────────────────────────────────────────────

lint:bandit:
  extends: .python-base
  stage: validate
  script:
    - echo "=== bandit security linter ==="
    - bandit -r ${SCRIPTS_DIR} -ll -f json -o bandit-report.json || bandit -r ${SCRIPTS_DIR} -ll -f txt
    - echo "bandit complete — see bandit-report.json"
  artifacts:
    name: "bandit-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bandit-report.json
    expire_in: 7 days
    when: always
  allow_failure: true   # advisory only — does not block pipeline
  rules:
    - changes:
        - scripts/**/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─────────────────────────────────────────────────────────────────────────────
# Stage: plan
# ─────────────────────────────────────────────────────────────────────────────

tf:plan:
  stage: plan
  image: hashicorp/terraform:1.6
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**/*

# ─────────────────────────────────────────────────────────────────────────────
# Stage: test
# ─────────────────────────────────────────────────────────────────────────────

test:aide_to_splunk:
  extends: .python-base
  stage: test
  script:
    - pytest ${TESTS_DIR}/test_aide_to_splunk.py
        -v --tb=short
        --junit-xml=test-results/aide_to_splunk.xml
        --cov=${SCRIPTS_DIR}/aide_to_splunk
        --cov-report=term-missing
        --cov-report=xml:coverage/aide_to_splunk.xml
        --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    name: "test-aide-${CI_COMMIT_SHORT_SHA}"
    reports:
      junit: test-results/aide_to_splunk.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/aide_to_splunk.xml
    paths:
      - test-results/
      - coverage/
    expire_in: 30 days
    when: always
  needs:
    - lint:flake8
  rules:
    - changes:
        - scripts/aide_to_splunk.py
        - tests/test_aide_to_splunk.py
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:freeipa_account_auditor:
  extends: .python-base
  stage: test
  script:
    - pytest ${TESTS_DIR}/test_freeipa_account_auditor.py
        -v --tb=short
        --junit-xml=test-results/freeipa_account_auditor.xml
        --cov=${SCRIPTS_DIR}/freeipa_account_auditor
        --cov-report=term-missing
        --cov-report=xml:coverage/freeipa_account_auditor.xml
        --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    name: "test-freeipa-${CI_COMMIT_SHORT_SHA}"
    reports:
      junit: test-results/freeipa_account_auditor.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/freeipa_account_auditor.xml
    paths:
      - test-results/
      - coverage/
    expire_in: 30 days
    when: always
  needs:
    - lint:flake8
  rules:
    - changes:
        - scripts/freeipa_account_auditor.py
        - tests/test_freeipa_account_auditor.py
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:k8s_secret_auditor:
  extends: .python-base
  stage: test
  script:
    - pytest ${TESTS_DIR}/test_k8s_secret_auditor.py
        -v --tb=short
        --junit-xml=test-results/k8s_secret_auditor.xml
        --cov=${SCRIPTS_DIR}/k8s_secret_auditor
        --cov-report=term-missing
        --cov-report=xml:coverage/k8s_secret_auditor.xml
        --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    name: "test-k8s-${CI_COMMIT_SHORT_SHA}"
    reports:
      junit: test-results/k8s_secret_auditor.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/k8s_secret_auditor.xml
    paths:
      - test-results/
      - coverage/
    expire_in: 30 days
    when: always
  needs:
    - lint:flake8
  rules:
    - changes:
        - scripts/k8s_secret_auditor.py
        - tests/test_k8s_secret_auditor.py
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:all:
  extends: .python-base
  stage: test
  script:
    - echo "=== Full suite: all scripts combined ==="
    - pytest ${TESTS_DIR}/
        -v --tb=short
        --junit-xml=test-results/all.xml
        --cov=${SCRIPTS_DIR}
        --cov-report=term-missing
        --cov-report=html:coverage/html/
        --cov-report=xml:coverage/all.xml
    - echo "All tests passed"
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    name: "test-all-${CI_COMMIT_SHORT_SHA}"
    reports:
      junit: test-results/all.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/all.xml
    paths:
      - test-results/
      - coverage/
    expire_in: 30 days
    when: always
  needs:
    - lint:flake8
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─────────────────────────────────────────────────────────────────────────────
# Stage: deploy
# ─────────────────────────────────────────────────────────────────────────────

deploy:monitoring:
  stage: deploy
  image: cytopia/ansible:latest
  script:
    - ansible-playbook ansible/playbooks/deploy_monitoring.yml
  environment:
    name: homelab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - kubernetes/prometheus/**/*
        - kubernetes/grafana/**/*
      when: manual

deploy:awx:
  stage: deploy
  image: cytopia/ansible:latest
  script:
    - ansible-playbook ansible/playbooks/deploy_awx.yml
  environment:
    name: homelab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ─────────────────────────────────────────────────────────────────────────────
# Stage: verify
# ─────────────────────────────────────────────────────────────────────────────

verify:cluster:
  stage: verify
  image: bitnami/kubectl:latest
  script:
    - bash scripts/verify-cluster-health.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

verify:test-summary:
  extends: .python-base
  stage: verify
  script:
    - echo "=== Test Summary ==="
    - echo "Commit ${CI_COMMIT_SHORT_SHA} on ${CI_COMMIT_REF_NAME}"
    - |
      if [ -f test-results/all.xml ]; then
        python3 -c "
      import xml.etree.ElementTree as ET
      tree = ET.parse('test-results/all.xml')
      root = tree.getroot()
      suite = root if root.tag == 'testsuite' else root.find('testsuite')
      if suite is not None:
          tests    = suite.get('tests', '?')
          failures = suite.get('failures', '0')
          errors   = suite.get('errors', '0')
          elapsed  = suite.get('time', '?')
          print(f'Tests: {tests} | Failures: {failures} | Errors: {errors} | Time: {elapsed}s')
      "
      fi
  needs:
    - test:all
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: always

# ─────────────────────────────────────────────────────────────────────────────
# Scheduled: weekly full audit (not triggered on push)
# ─────────────────────────────────────────────────────────────────────────────

test:scheduled-full:
  extends: .python-base
  stage: test
  script:
    - flake8 ${SCRIPTS_DIR}/ --max-line-length=120 --ignore=W503,E402
    - bandit -r ${SCRIPTS_DIR}/ -f txt || true
    - pytest ${TESTS_DIR}/ -v --tb=long --cov=${SCRIPTS_DIR} --cov-report=term
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
